<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicles of the Sword Coast</title>
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>
<div id="app">
  <div id="title-screen">
    <div class="title-main">Chronicles of the Sword Coast</div>
    <div class="title-sub">A Fantasy Browser RPG</div>
    <div class="title-divider"></div>
    <div class="title-buttons">
      <button class="btn btn-primary btn-lg" id="new-game-btn">New Adventure</button>
      <button class="btn btn-lg" id="load-btn" style="display:none">Continue Journey</button>
      <button class="btn btn-lg" id="title-tutorial-btn">Tutorial</button>
    </div>
    <div class="title-flavor">New to the game? Open <strong>Tutorial</strong> first—it explains every part of the screen.</div>
  </div>

  <div id="char-creation"></div>

  <div id="game-screen">
    <div class="game-header">
      <div class="location-display" id="location-name">Protector's Enclave, Neverwinter</div>
      <div class="char-brief" id="char-brief"></div>
      <div class="header-btns">
        <button class="btn btn-sm" id="toggle-sidebar-btn">Sheet</button>
        <button class="btn btn-sm" id="rest-btn">Rest</button>
        <button class="btn btn-sm" id="save-btn">Save</button>
        <button class="btn btn-sm" id="help-btn">Help</button>
      </div>
    </div>

    <div class="game-body">
      <div class="game-main">
        <div class="scene-panel" id="scene-illustration">
          <img id="scene-image" class="scene-image" src="./assets/scenes/default.svg" alt="Current location" width="640" height="200" decoding="async" />
          <div class="scene-caption" id="scene-caption"></div>
        </div>
        <div class="narrative-panel" id="narrative-panel">
          <div class="narrative-text" id="narrative"></div>
        </div>
        <div class="action-panel">
          <div class="actions" id="actions"></div>
        </div>
      </div>

      <aside class="game-sidebar" id="sidebar">
        <div class="sidebar-tabs" id="sidebar-tabs">
          <div class="sidebar-tab active" data-tab="character">Character</div>
          <div class="sidebar-tab" data-tab="party">Party</div>
          <div class="sidebar-tab" data-tab="inventory">Inventory</div>
          <div class="sidebar-tab" data-tab="quests">Quests</div>
          <div class="sidebar-tab" data-tab="spells">Spells</div>
          <div class="sidebar-tab" data-tab="log">Log</div>
          <div class="sidebar-tab" data-tab="help">Help</div>
        </div>
        <div class="sidebar-content">
          <div class="sidebar-panel active" id="panel-character"></div>
          <div class="sidebar-panel" id="panel-party"></div>
          <div class="sidebar-panel" id="panel-inventory"></div>
          <div class="sidebar-panel" id="panel-quests"></div>
          <div class="sidebar-panel" id="panel-spells"></div>
          <div class="sidebar-panel" id="panel-log"></div>
          <div class="sidebar-panel" id="panel-help"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="tutorial-modal" class="modal-overlay tutorial-overlay" aria-hidden="true">
    <div class="tutorial-panel" role="dialog" aria-labelledby="tutorial-step-title">
      <h2 class="tutorial-step-title" id="tutorial-step-title"></h2>
      <div class="tutorial-step-body" id="tutorial-step-body"></div>
      <div class="tutorial-progress" id="tutorial-progress"></div>
      <div class="tutorial-nav">
        <button type="button" class="btn" id="tutorial-prev">Back</button>
        <button type="button" class="btn btn-primary" id="tutorial-next">Next</button>
        <button type="button" class="btn" id="tutorial-close-footer">Close</button>
      </div>
    </div>
  </div>

  <div id="world-map-modal" class="modal-overlay world-map-overlay" aria-hidden="true">
    <div class="world-map-panel">
      <h2 class="world-map-title">Neverwinter &amp; Environs</h2>
      <p class="world-map-hint" id="world-map-hint"></p>
      <div class="world-map-canvas">
        <svg id="world-map-svg" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div id="world-map-nodes" class="world-map-nodes"></div>
      </div>
      <div class="world-map-footer">
        <button type="button" class="btn" id="world-map-close">Close</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
<script src="./podcast-player.js?v=3" defer></script>
</body>
</html>
